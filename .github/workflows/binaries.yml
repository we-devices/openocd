name: OpenOCD binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: windows-x86_64
            runner: windows-2022
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve Unix line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize bundled Tcl interpreter
        run: git submodule update --init jimtcl
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake ninja-build texinfo
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config ninja texinfo
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            autoconf automake libtool make texinfo zip git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Build and package Unix binaries
        if: runner.os != 'Windows'
        run: bash contrib/build-binaries.sh '${{ matrix.platform }}'
      - name: Build and package Windows binaries
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash contrib/build-binaries.sh '${{ matrix.platform }}'
      - name: Upload installable archives
        uses: actions/upload-artifact@v4
        with:
          name: openocd-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openocd-*
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" dist/* --clobber
